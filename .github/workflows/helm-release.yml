name: Publish Helm chart

# Stable releases: push to main (or a git tag) -> packaged with the exact
# version in Chart.yaml.
# Dev builds: push to development -> packaged with a semver pre-release
# suffix (<Chart.yaml version>-dev.<run number>+<short sha>), so they land
# in the SAME Helm repo index as stable releases without colliding with
# them or with each other. `helm search repo`/`helm install` ignore
# pre-release versions unless you pass --devel or pin the exact version,
# so dev builds don't show up unless someone asks for them.
on:
  push:
    branches:
      - main
      - development
    paths:
      - "headscale/**"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CHART_DIR: headscale
  HELM_VERSION: v3.15.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Compute chart version
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION=$(awk '/^version:/{print $2}' "${CHART_DIR}/Chart.yaml" | tr -d '"')
          if [ "${GITHUB_REF_NAME}" = "development" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          else
            VERSION="${BASE_VERSION}"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} (${GITHUB_REF_NAME})"

      - name: Stamp chart version (this checkout only, never committed back)
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" \
            "${CHART_DIR}/Chart.yaml"
          cat "${CHART_DIR}/Chart.yaml"

      - name: Lint chart
        run: helm lint "${CHART_DIR}"

      - name: Package chart
        run: |
          mkdir -p .packaged
          helm package "${CHART_DIR}" --destination .packaged

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish to the repo index
        run: |
          set -euo pipefail
          cp .packaged/*.tgz gh-pages/
          cd gh-pages
          REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/$(basename "${GITHUB_REPOSITORY}")/"
          helm repo index . --merge index.yaml --url "${REPO_URL}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish ${{ steps.version.outputs.channel }} chart ${{ steps.version.outputs.version }}" \
            || { echo "nothing to commit"; exit 0; }
          git push
