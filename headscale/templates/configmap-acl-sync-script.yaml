{{- if and .Values.acl.enabled .Values.acl.sync.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "headscale.fullname" . }}-acl-sync-script
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: acl-sync
data:
  # Runs in the "headscale-pf" container. Only resolves the policy from the
  # source and writes it to the shared volume - no HTTP client needed here
  # at all, so this container's image only ever needs headscale-pf's own
  # binary + a shell. Applying the result is a SEPARATE container/script
  # (apply.sh) specifically because we can't assume this image ships curl
  # (it didn't, for the default image) - splitting responsibility means we
  # get to pick an image we're actually sure has curl for that part,
  # instead of gambling on this one.
  #
  # Exits (crashing the container) after acl.sync.failThreshold consecutive
  # failures, on purpose - a loop that just logs an error and keeps going
  # forever is invisible unless someone happens to be reading logs at the
  # right time. A crash shows up as a restart count / CrashLoopBackOff,
  # which actually gets noticed.
  prepare.sh: |
    #!/bin/sh
    set -u
    INTERVAL="${SYNC_INTERVAL_SECONDS:-300}"
    CURRENT=/shared/current.json
    FAILS=0

    while true; do
      TS=$(date -Is)
      echo "[$TS] headscale-pf prepare (source=$PF_SOURCE)"

      if headscale-pf prepare \
          --source="$PF_SOURCE" \
          --endpoint="$PF_ENDPOINT" \
          --token="$PF_TOKEN" \
          --input-policy=/etc/headscale-pf/policy.hjson \
          --output-policy="$CURRENT" \
          --output-format=json \
          $PF_EXTRA_ARGS; then
        echo "[$TS] wrote resolved policy to $CURRENT"
        FAILS=0
      else
        FAILS=$((FAILS + 1))
        echo "[$TS] ERROR: headscale-pf prepare failed ($FAILS/{{ .Values.acl.sync.failThreshold }})" >&2
        if [ "$FAILS" -ge {{ .Values.acl.sync.failThreshold }} ]; then
          echo "[$TS] giving up after {{ .Values.acl.sync.failThreshold }} consecutive failures, exiting" >&2
          exit 1
        fi
      fi

      sleep "$INTERVAL"
    done

  # Runs in the "policy-applier" container (curlimages/curl - guaranteed to
  # have curl, unlike the headscale-pf image). Watches the file prepare.sh
  # writes and PUTs it to headscale's REST API whenever it changes. Same
  # fail-and-crash-after-N-attempts reasoning as prepare.sh above.
  apply.sh: |
    #!/bin/sh
    set -u
    CURRENT=/shared/current.json
    APPLIED=/tmp/applied.json
    FAILS=0

    # HEADSCALE_API_TOKEN arrives either as a real env var (apiKey.existingSecret
    # was set) or, by default, via a file an initContainer fetched from Consul KV.
    if [ -z "${HEADSCALE_API_TOKEN:-}" ] && [ -f /shared/api-key ]; then
      HEADSCALE_API_TOKEN=$(cat /shared/api-key)
    fi

    # JSON-string-escape stdin (no surrounding quotes added) for embedding
    # as a value in a hand-built JSON body. curlimages/curl has no python3,
    # so this is sed/awk only - covers the characters headscale-pf's own
    # JSON output can realistically contain.
    json_escape() {
      sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\t/\\t/g' -e 's/\r/\\r/g' \
        | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/\\n/g'
    }

    while true; do
      TS=$(date -Is)
      if [ -f "$CURRENT" ]; then
        if [ -f "$APPLIED" ] && cmp -s "$CURRENT" "$APPLIED"; then
          : # no changes since last apply
        else
          echo "[$TS] policy changed, applying via the REST API (PUT /api/v1/policy) - live reload, no restart"
          ESCAPED=$(json_escape < "$CURRENT")
          printf '{"policy":"%s"}' "$ESCAPED" > /tmp/policy-request.json
          HTTP_CODE=$(curl -s -o /tmp/policy-response.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${HEADSCALE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/policy-request.json \
            "${HEADSCALE_API_URL}/api/v1/policy")
          if [ "$HTTP_CODE" = "200" ]; then
            cp "$CURRENT" "$APPLIED"
            echo "[$TS] policy applied successfully"
            FAILS=0
          else
            FAILS=$((FAILS + 1))
            echo "[$TS] ERROR: applying policy failed (HTTP $HTTP_CODE) ($FAILS/{{ .Values.acl.sync.failThreshold }})" >&2
            cat /tmp/policy-response.json >&2 2>/dev/null || true
            if [ "$FAILS" -ge {{ .Values.acl.sync.failThreshold }} ]; then
              echo "[$TS] giving up after {{ .Values.acl.sync.failThreshold }} consecutive failures, exiting" >&2
              exit 1
            fi
          fi
        fi
      fi
      sleep "${APPLY_POLL_SECONDS:-10}"
    done
{{- end -}}