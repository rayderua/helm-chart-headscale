{{- if .Values.postgresql.secretsEnv -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "headscale.fullname" . }}-postgresql-extra-env
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.postgresql.secretsEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end -}}
