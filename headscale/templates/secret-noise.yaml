{{/*
This Secret is only created when the key is provided DIRECTLY via values
(noisePrivateKey.value). If existingSecret is used instead, nothing is
created here - you're expected to manage that Secret yourself.
*/}}
{{- if and .Values.noisePrivateKey.value (not .Values.noisePrivateKey.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "headscale.noiseSecretName" . }}
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
type: Opaque
stringData:
  noise_private.key: {{ .Values.noisePrivateKey.value | quote }}
{{- end -}}
