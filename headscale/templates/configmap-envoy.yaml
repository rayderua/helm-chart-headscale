apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "headscale.fullname" . }}-envoy
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: ha
data:
  # Static bootstrap - never changes at runtime. The only dynamic piece is
  # the EDS endpoint for each cluster, read from a file on a shared volume
  # that the consul-agent sidecar keeps up to date (see render-eds.sh).
  # Envoy watches that file via inotify and swaps the upstream in-process,
  # no reload/restart needed on failover.
  #
  # node is required - Envoy's EDS/filesystem-subscription machinery wants
  # a node identity even for local file-delivered config, not just real
  # xDS. --service-node/--service-cluster CLI flags are documented as an
  # alternative but didn't actually satisfy this in practice - a real
  # static value here does. Same on all 3 pods (this ConfigMap is shared)
  # - fine for our purposes, you already know which pod's Envoy you're
  # looking at from kubectl context.
  envoy.yaml: |
    node:
      id: headscale-envoy
      cluster: headscale-envoy
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    static_resources:
      listeners:
      - name: http_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: {{ .Values.service.httpPort }} }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: headscale_http
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              # headscale's own control protocol rides an HTTP Upgrade with
              # this upgrade-type token - HCM only allows "websocket" by
              # default, so without this the actual tailscale control
              # connections get rejected even though plain HTTP requests
              # (like the /health check) would work fine.
              upgrade_configs:
              - upgrade_type: tailscale-control-protocol
              route_config:
                name: headscale_http_route
                virtual_hosts:
                - name: headscale_http
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: { cluster: headscale_http_active }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      - name: grpc_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: {{ .Values.service.grpcPort }} }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: headscale_grpc
              # gRPC is cleartext HTTP/2 here (no TLS/ALPN to negotiate the
              # codec from) - has to be told explicitly, otherwise HCM
              # defaults to HTTP/1.1 on the downstream side and gRPC calls
              # never get off the ground.
              http2_protocol_options: {}
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              route_config:
                name: headscale_grpc_route
                virtual_hosts:
                - name: headscale_grpc
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: { cluster: headscale_grpc_active }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: headscale_http_active
        connect_timeout: 1s
        type: EDS
        eds_cluster_config:
          eds_config:
            path_config_source:
              path: /shared/eds/http.yaml
              watched_directory: { path: /shared/eds }
        lb_policy: ROUND_ROBIN
{{- if .Values.ha.envoy.activeHealthCheck.enabled }}
        health_checks:
        - timeout: {{ .Values.ha.envoy.activeHealthCheck.timeoutSeconds }}s
          interval: {{ .Values.ha.envoy.activeHealthCheck.intervalSeconds }}s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /health
            host: headscale
{{- end }}
      - name: headscale_grpc_active
        connect_timeout: 1s
        type: EDS
        eds_cluster_config:
          eds_config:
            path_config_source:
              path: /shared/eds/grpc.yaml
              watched_directory: { path: /shared/eds }
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
