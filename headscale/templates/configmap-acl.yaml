{{/*
This ConfigMap is only used when ACLs are defined statically via values
(without headscale-pf). When acl.sync.enabled=true, policy.mode=database
and headscale-pf applies the policy directly via the REST API (PUT /api/v1/policy)
(gRPC), so headscale never reads this file at all - see
configmap-acl-sync-template.yaml instead, which renders from the SAME
acl.policy/acl.rawPolicy values via headscale.renderAclPolicy.
*/}}
{{- if and .Values.acl.enabled (not .Values.acl.sync.enabled) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "headscale.fullname" . }}-acl
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
data:
  policy.hujson: |
{{ include "headscale.renderAclPolicy" . | indent 4 }}
{{- end -}}
