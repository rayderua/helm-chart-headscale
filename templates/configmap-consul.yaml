{{ include "headscale.haValidate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "headscale.consulFullname" . }}-config
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: consul-server
data:
  server.json: |
    {
      "server": true,
      "bootstrap_expect": {{ .Values.ha.consul.replicas }},
      "datacenter": "dc1",
      "data_dir": "/consul/data",
      "client_addr": "0.0.0.0",
      "ui_config": { "enabled": false },
      "retry_join": ["{{ include "headscale.consulJoinAddress" . }}"],
      "disable_update_check": true,
      "log_level": "INFO",
      "leave_on_terminate": true,
      "ports": {
        "grpc": -1
      }
{{- if .Values.ha.consul.acl.enabled }}
      ,"acl": {
        "enabled": true,
        "default_policy": "deny",
        "enable_token_persistence": true
      }
{{- end }}
    }
