apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "headscale.fullname" . }}-envoy
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: ha
data:
  # Static bootstrap - never changes at runtime. The only dynamic piece is
  # the EDS endpoint for each cluster, read from a file on a shared volume
  # that the consul-agent sidecar keeps up to date (see render-eds.sh).
  # Envoy watches that file via inotify and swaps the upstream in-process,
  # no reload/restart needed on failover.
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    static_resources:
      listeners:
      - name: http_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: {{ .Values.service.httpPort }} }
        filter_chains:
        - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: headscale_http
              cluster: headscale_http_active
      - name: grpc_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: {{ .Values.service.grpcPort }} }
        filter_chains:
        - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: headscale_grpc
              cluster: headscale_grpc_active
      clusters:
      - name: headscale_http_active
        connect_timeout: 1s
        type: EDS
        eds_cluster_config:
          eds_config:
            path_config_source:
              path: /shared/eds/http.yaml
              watched_directory: { path: /shared/eds }
        lb_policy: ROUND_ROBIN
{{- if .Values.ha.envoy.activeHealthCheck.enabled }}
        health_checks:
        - timeout: {{ .Values.ha.envoy.activeHealthCheck.timeoutSeconds }}s
          interval: {{ .Values.ha.envoy.activeHealthCheck.intervalSeconds }}s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /health
            host: headscale
{{- end }}
      - name: headscale_grpc_active
        connect_timeout: 1s
        type: EDS
        eds_cluster_config:
          eds_config:
            path_config_source:
              path: /shared/eds/grpc.yaml
              watched_directory: { path: /shared/eds }
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
